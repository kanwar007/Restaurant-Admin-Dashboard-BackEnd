name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B verify

  compose-smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/health >/dev/null \
              && curl -fsS -X POST http://localhost:4000/api/auth/login \
                   -H 'Content-Type: application/json' \
                   -d '{"username":"admin","password":"admin123"}' >/dev/null \
              && curl -fsS http://localhost:4000/api/menu >/dev/null \
              && curl -fsS http://localhost:4000/api/tables >/dev/null \
              && curl -fsS http://localhost:4000/api/order-history >/dev/null \
              && curl -fsS http://localhost:4000/api/dashboard >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs --tail 200
          exit 1
      - name: Smoke test API contract
        run: ./scripts/smoke-test.sh http://localhost:4000
      - name: Tear down
        if: always()
        run: docker compose down -v
