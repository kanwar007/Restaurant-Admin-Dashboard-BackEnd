server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: floor-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cafeadmin}
    username: ${DB_USERNAME:cafeadmin}
    password: ${DB_PASSWORD:cafeadmin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: floor
  flyway:
    enabled: true
    schemas: floor
    default-schema: floor

app:
  restaurant-id: ${RESTAURANT_ID:11111111-1111-1111-1111-111111111111}
  seed-function: floor.seed_demo_data
  reset:
    enabled: ${RESET_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
