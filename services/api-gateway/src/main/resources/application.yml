server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: '*'
            allowedMethods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
            allowedHeaders: '*'

app:
  reset:
    enabled: ${RESET_ENABLED:true}
  services:
    identity: ${IDENTITY_URL:http://localhost:8081}
    catalog: ${CATALOG_URL:http://localhost:8082}
    floor: ${FLOOR_URL:http://localhost:8083}
    ordering: ${ORDERING_URL:http://localhost:8084}
    billing: ${BILLING_URL:http://localhost:8085}
    reporting: ${REPORTING_URL:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
