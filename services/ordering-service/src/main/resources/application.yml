server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: ordering-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cafeadmin}
    username: ${DB_USERNAME:cafeadmin}
    password: ${DB_PASSWORD:cafeadmin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ordering
  flyway:
    enabled: true
    schemas: ordering
    default-schema: ordering

app:
  restaurant-id: ${RESTAURANT_ID:11111111-1111-1111-1111-111111111111}
  timezone: ${RESTAURANT_TIMEZONE:Asia/Kolkata}
  catalog-url: ${CATALOG_URL:http://localhost:8082}
  floor-url: ${FLOOR_URL:http://localhost:8083}
  seed-function: ordering.seed_demo_data
  reset:
    enabled: ${RESET_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
