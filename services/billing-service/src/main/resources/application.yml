server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: billing-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cafeadmin}
    username: ${DB_USERNAME:cafeadmin}
    password: ${DB_PASSWORD:cafeadmin}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: billing
  flyway:
    enabled: true
    schemas: billing
    default-schema: billing

app:
  restaurant-id: ${RESTAURANT_ID:11111111-1111-1111-1111-111111111111}
  timezone: ${RESTAURANT_TIMEZONE:Asia/Kolkata}
  ordering-url: ${ORDERING_URL:http://localhost:8084}
  identity-url: ${IDENTITY_URL:http://localhost:8081}
  seed-function: billing.seed_demo_data
  reset:
    enabled: ${RESET_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
