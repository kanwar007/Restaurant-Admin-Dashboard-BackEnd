apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - gateway-nodeport.yaml

# Single replica and in-cluster Postgres keep a local kind/minikube/docker-desktop cluster light.
replicas:
  - name: identity-service
    count: 1
  - name: catalog-service
    count: 1
  - name: floor-service
    count: 1
  - name: ordering-service
    count: 1
  - name: billing-service
    count: 1
  - name: reporting-service
    count: 1
  - name: api-gateway
    count: 1

images:
  - name: ghcr.io/kanwar007/restaurant-admin-dashboard-backend/identity-service
    newName: cafe-admin/identity-service
    newTag: local
  - name: ghcr.io/kanwar007/restaurant-admin-dashboard-backend/catalog-service
    newName: cafe-admin/catalog-service
    newTag: local
  - name: ghcr.io/kanwar007/restaurant-admin-dashboard-backend/floor-service
    newName: cafe-admin/floor-service
    newTag: local
  - name: ghcr.io/kanwar007/restaurant-admin-dashboard-backend/ordering-service
    newName: cafe-admin/ordering-service
    newTag: local
  - name: ghcr.io/kanwar007/restaurant-admin-dashboard-backend/billing-service
    newName: cafe-admin/billing-service
    newTag: local
  - name: ghcr.io/kanwar007/restaurant-admin-dashboard-backend/reporting-service
    newName: cafe-admin/reporting-service
    newTag: local
  - name: ghcr.io/kanwar007/restaurant-admin-dashboard-backend/api-gateway
    newName: cafe-admin/api-gateway
    newTag: local
