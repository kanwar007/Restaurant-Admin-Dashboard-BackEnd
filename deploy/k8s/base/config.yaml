apiVersion: v1
kind: ConfigMap
metadata:
  name: cafe-admin-config
data:
  DB_URL: jdbc:postgresql://postgres:5432/cafeadmin
  IDENTITY_URL: http://identity-service:8081
  CATALOG_URL: http://catalog-service:8082
  FLOOR_URL: http://floor-service:8083
  ORDERING_URL: http://ordering-service:8084
  BILLING_URL: http://billing-service:8085
  REPORTING_URL: http://reporting-service:8086
  RESTAURANT_TIMEZONE: Asia/Kolkata
  RESTAURANT_ID: 11111111-1111-1111-1111-111111111111
---
apiVersion: v1
kind: Secret
metadata:
  name: cafe-admin-db
type: Opaque
stringData:
  # Replace in real environments, for example with an AKS workload identity or Key Vault CSI secret.
  username: cafeadmin
  password: cafeadmin
